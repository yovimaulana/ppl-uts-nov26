<script>
const S=[
["P1 · Pendahuluan & Penggerak Desain",[
"<b>Kebutuhan</b> = tujuan, batasan, kriteria sukses. <b>Desain</b> = struktur, tanggung jawab, interaksi. <b>Implementasi</b> = kode &amp; konfigurasi. Pengujian/operasi memberi umpan balik ke desain.",
"<b>4 penggerak desain</b>: fungsi penting, atribut kualitas, kendala, konteks (pemangku kepentingan, sistem eksternal, lingkungan).",
"<b>Abstraksi</b>: tampilkan konsep penting pada tingkat tertentu (kontrak tanpa detail penyimpanan). <b>Modularitas</b>: unit bertanggung jawab jelas; banyak modul ≠ kualitas baik.",
"<b>Separation of concerns</b>: aturan reservasi, tampilan, pesan punya alasan berubah berbeda. Keamanan &amp; logging = <i>cross-cutting</i>.",
"<b>Information hiding</b> = sembunyikan keputusan yang mungkin berubah. <b>Enkapsulasi</b> = kelompokkan data+operasi &amp; kendalikan akses.",
"<b>Kohesi</b> = keterkaitan di <u>dalam</u> satu modul (tinggi = baik). <b>Coupling</b> = ketergantungan <u>antar</u> modul. Jumlah fungsi saja tak cukup menyimpulkan coupling.",
"Tidak ada satu rancangan unggul untuk semua konteks. Contoh: cache ↑ kecepatan baca tapi ↑ isu konsistensi; pisah layanan ↑ koordinasi &amp; operasi.",
"Kasus klinik: konfirmasi bisa gagal → <b>pisahkan status reservasi dan status kirim</b> (butuh pencatatan gagal + kirim ulang). Keterlacakan: kebutuhan → keputusan → pertanyaan evaluasi.",
"Penilaian: kuis 10%, tugas 10%, proyek 40%, UTS 20%, UAS 20%. Arsitektur P1 (pert. 5), P2 (10), P3 (14)."]],
["P2 · Kebutuhan & Skenario Kualitas",[
"Kategori: <b>batasan wajib</b> (SSO kampus wajib), <b>asumsi</b> (lonjakan 200 user → validasi data), <b>preferensi</b> (tim bisa Java → bandingkan), <b>keputusan desain</b> (cache → evaluasi manfaat &amp; risiko).",
"<b>Kebutuhan signifikan</b>: dampak luas, risiko tinggi, sulit dipenuhi, biaya perubahan tinggi.",
"<b>6 unsur skenario kualitas</b>: sumber stimulus, stimulus, lingkungan, artefak, respons, ukuran respons.",
"Q-01 Kinerja: 200 user, 20 req/dtk, 15 mnt → <b>p95 ≤ 2 dtk, error teknis &lt; 1%</b>. Q-02 Pemulihan: <b>pulih ≤ 60 dtk, kehilangan transaksi terkonfirmasi = 0</b>. Q-03 Otorisasi: batal reservasi orang lain → ditolak + audit. Q-04 Modifikasi: aturan durasi baru <b>≤ 1 hari kerja (≤ 8 jam), ≤ 2 modul</b>. Q-05 Usability: <b>≥ 8/10 peserta, ≤ 3 menit</b>.",
"Ukuran harus tepat: “cepat” → batas latensi+profil beban; “aman” → ancaman+aturan akses+kasus uji; “mudah diubah” → jenis perubahan+batas usaha. Angka target butuh alasan bisnis/asumsi.",
"Konflik kualitas: audit sinkron ↔ latensi; redundansi ↔ biaya operasi. Prioritas = kepentingan bisnis × kesulitan teknis.",
"Keterlacakan: Kebutuhan (FR) → Skenario (Q) → Isu desain → Bukti (uji beban, uji akses negatif, dst)."]],
["P3 · Alternatif Arsitektur & Trade-off",[
"Penggerak mendahului pilihan teknologi. Keputusan arsitektur harus dapat ditelusuri ke penggerak.",
"<b>Layered</b> (presentasi, aplikasi, domain, infrastruktur) mengatur <i>dependensi</i>; <b>modular monolith</b> = satu unit deployment; <b>layanan</b> = deployment terpisah via jaringan. Dimensi berbeda → bisa digabung (monolith/layanan punya lapisan internal).",
"Layered: + pemisahan &amp; uji per lapisan; − perubahan lintas lapisan, lapisan sekadar meneruskan panggilan.",
"Modular monolith: transaksi lokal, operasi awal sederhana; perubahan satu modul bisa menuntut deploy seluruh aplikasi. Layanan: isolasi deploy &amp; penskalaan fleksibel; tapi latensi jaringan, kegagalan parsial, transaksi lintas batas, perlu observability &amp; otomasi.",
"Taktik berbiaya: cache (perlu invalidasi), replika (ketersediaan), antarmuka stabil (batasi rambatan perubahan), otorisasi+audit.",
"Matriks berbobot: Total = Σ(bobot desimal × nilai). Skor itu hipotesis, bukan benchmark. <b>Koreksi:</b> total A di slide tertulis 4,10, padahal hitungan benar = <b>4,05</b>; B = 3,00.",
"A (monolith) jadi baseline: tim kecil + tenggat singkat. Constraint unik/transaksi atomik melindungi slot; <b>outbox + worker</b> memisahkan kegagalan notifikasi; ekstraksi layanan perlu pemicu terukur."]],
["P4 · Notasi Arsitektur & Keputusan Desain",[
"<b>Model konteks</b>: sistem sebagai satu kesatuan + aktor + sistem eksternal (SSO, penyedia pengingat); hubungan diberi label tujuan pertukaran.",
"<b>Komponen UML</b>: «component»; <b>provided interface</b> = layanan ditawarkan; <b>required interface</b> = layanan dibutuhkan; <b>assembly connector</b> menghubungkan keduanya.",
"<b>Dependency</b>: garis putus-putus, panah terbuka, dari client ke supplier. <b>Realization</b>: garis putus-putus, segitiga kosong ke abstraksi. Dependensi kode ≠ aliran data runtime.",
"<b>Deployment</b>: node, device (perangkat fisik), execution environment, artifact (mis. lab-app.jar), communication path. Containment = penempatan artefak.",
"Pengembalian offline: browser simpan operasi dengan <b>operationId unik</b> → kirim saat online → server validasi izin, versi data, duplikasi → konflik masuk antrean review petugas.",
"Konsistensi antar-view: nama, batas sistem, asumsi offline sama; aktor di konteks punya titik interaksi di komponen; komponen terpetakan ke artefak.",
"<b>ADR</b> = konteks, pilihan, alasan, alternatif ditolak + konsekuensi; status usulan/diterima/digantikan; ditinjau saat penggerak berubah. ADR-01 persetujuan harus daring (alat tak boleh 2 peminjam aktif; konsekuensi persetujuan tertunda saat jaringan gagal). ADR-02 modular monolith. ADR-03 pengingat asinkron dengan outbox."]],
["P5 · Strategi Desain & Baseline",[
"<b>Top-down</b>: mulai dari tujuan/skenario/batas → dekomposisi. <b>Bottom-up</b>: mulai dari aset/kemampuan tersedia → komposisi. Digabung: top-down menetapkan invariant, bottom-up menguji (transaksi, constraint).",
"Dekomposisi: Inventaris (identitas &amp; kondisi alat), Peminjaman (siklus ajuan→kembali, jaga pinjaman aktif), Notifikasi (gagal kirim tidak batalkan transaksi), Pelaporan (tidak ubah status operasional).",
"<b>Iteratif</b> = memperbaiki (revisi rancangan setelah uji). <b>Incremental</b> = menambah cakupan (rilis berikutnya tambah fitur).",
"Bukti harus sesuai pertanyaan: pemahaman UI → uji tugas prototipe; dua persetujuan sukses bersama? → uji konkurensi (spike); p95 ≤ 3 dtk → <b>uji beban</b> (storyboard tak cukup); perubahan aturan → simulasi + review dampak.",
"Agile: kolaborasi pengguna, perangkat lunak berjalan, dokumentasi tetap bernilai, desain baik mendukung adaptasi. <b>Design Sprint 5 hari</b>: Map, Sketch, Decide, Prototype, Test. Prototipe UI harus dilengkapi eksperimen teknis untuk risiko arsitektur.",
"<b>Baseline</b> = acuan berversi; risiko terbuka punya pemilik &amp; rencana validasi; temuan baru → perubahan terkontrol. Paket P1: ≥ 4 skenario kualitas, ≥ 2 alternatif, ≥ 3 keputusan, matriks keterlacakan, risiko, kontribusi anggota."]],
["P6 · Rancangan Rinci & Kontrak",[
"Cohesion: kelas LoanManager yang setujui pinjaman + hitung gaji + buat PDF = kohesi rendah. Coupling naik bila modul baca tabel/detail internal modul lain; tanda: perubahan tersebar &amp; dependensi melingkar. Tujuan: dependensi perlu &amp; terkelola, bukan nol.",
"<b>SOLID</b>: SRP (alasan perubahan berbeda tercampur?), OCP (variasi lewat kontrak stabil, mis. ApprovalPolicy), LSP (pengganti tak perkuat prasyarat / lemahkan jaminan), ISP (klien tak bergantung operasi yang tak dibutuhkan), DIP (kebijakan domain bergantung pada abstraksi: ApprovalService → «interface» LoanRepository ← SqlLoanRepository).",
"Abstraksi hanya bila variasi relevan, bukan untuk setiap if.",
"<b>Kontrak</b>: signature, prasyarat (kewajiban sebelum panggilan), pascasyarat (jaminan hasil), invariant (kondisi stabil). Batas sistem tetap memvalidasi input tak tepercaya. Alat tak tersedia = hasil bisnis sah, bukan crash.",
"approveLoan(requestId, actorId, operationId): sukses LoanApproved; gagal NotFound, Forbidden, Unavailable, InvalidState; retry intent sama → hasil tersimpan setara; gagal bisnis → tanpa perubahan parsial. Invariant: ≤ 1 pinjaman aktif per alat.",
"Konkurensi: cek-lalu-update saja tidak cukup; perlu transaksi/constraint/penguncian + uji skenario serentak.",
"Diagram kelas: <code>−</code> private, <code>+</code> public; LoanRequest 1 — 0..1 Loan (satu request menghasilkan paling banyak satu loan). Pengujian diturunkan dari kontrak (retry operationId sama → efek tetap satu; ID sama payload beda → tolak; gagal sebelum commit → rollback)."]],
["P7 · Kolaborasi Komponen & Konsistensi Perilaku",[
"Kontrak (syarat &amp; hasil), diagram sekuens (siapa memanggil siapa, urutan), model status (perubahan sah), batas transaksi (apa yang harus berhasil bersama).",
"Peserta: ApprovalController (terima/respons), ApprovalService (koordinasi), Loan (aturan status), InventoryService (kelayakan), LoanRepository (data).",
"Cabang alternatif: tak ditemukan → gagal; tak berwenang → tolak; alat tak layak → tetap <i>Diajukan</i>; sudah dialokasikan → konflik.",
"<b>Status</b>: Diajukan→Disetujui (setuju) / Ditolak (tolak) / Dibatalkan (batal pemohon); Disetujui→Dipinjam (penyerahan) / Dibatalkan (+lepas alokasi); Dipinjam→Dikembalikan. Disetujui &amp; Dipinjam = pinjaman aktif.",
"Kegagalan: penyimpanan gagal → batalkan (rollback); <b>notifikasi gagal setelah commit → pertahankan persetujuan &amp; jadwalkan ulang</b>. Transaksi: status+alokasi dalam satu transaksi; bila lintas layanan perlu koordinasi &amp; pemulihan.",
"<b>Idempotensi</b>: pengulangan menghasilkan efek akhir sama; requestId sama → kembalikan hasil tercatat. <b>Dua persetujuan bersamaan</b>: pembaruan atomik/penguncian/constraint DB; yang kalah dapat konflik.",
"Review: pesan sesuai tanggung jawab penerima? kegagalan punya keadaan akhir? transisi penuhi kontrak? retry tak menambah efek? permintaan bersamaan tak langgar invariant?"]]];

["Jelaskan enam unsur skenario kualitas dan buat satu contoh skenario kinerja terukur.","Unsur: sumber stimulus, stimulus, lingkungan, artefak, respons, ukuran respons. Contoh: mahasiswa (sumber) mengirim permintaan pemesanan (stimulus) pada 200 pengguna virtual, 20 req/dtk selama 15 menit (lingkungan); operasi pemesanan API masuk→respons keluar (artefak); sistem memberi konfirmasi atau penolakan bisnis valid (respons); p95 ≤ 2 dtk, error teknis &lt; 1% (ukuran). Bukti: uji beban + log latensi."],
["Bandingkan modular monolith dan arsitektur layanan untuk sistem dengan tim kecil dan tenggat singkat. Mana yang dipilih dan kapan berubah?","Monolith: transaksi lokal, konsistensi slot mudah, operasi sederhana, rilis cepat; risiko deploy menyeluruh, batas modul perlu aturan dependensi. Layanan: isolasi deploy &amp; penskalaan terpisah; biaya latensi, kegagalan parsial, transaksi lintas batas, observability. Dengan tim kecil/tenggat singkat pilih modular monolith (baseline) + outbox/worker untuk notifikasi; ekstraksi layanan bila ada pemicu terukur (mis. kebutuhan skala berbeda). Matriks berbobot hanyalah hipotesis, periksa kebutuhan wajib dahulu."],
["Apa itu ADR? Tulis contoh ADR persetujuan peminjaman alat.","ADR menyimpan konteks, keputusan, alternatif (termasuk yang ditolak), dan konsekuensi; status usulan/diterima/digantikan; ditinjau saat penggerak/bukti berubah. Contoh ADR-01: <i>Konteks</i> koneksi lab terputus tetapi alat tak boleh punya dua peminjam aktif. <i>Keputusan</i> server pusat memvalidasi setiap persetujuan; pengembalian boleh dicatat offline. <i>Alternatif</i> persetujuan offline + rekonsiliasi ditolak. <i>Konsekuensi</i> konsistensi terjaga, persetujuan tertunda saat jaringan gagal; sertakan risiko, mitigasi, rencana validasi."],
["Kritik kelas TaskManager (submit, uploadToCloud, sendEmail, exportGradeReport, updateDeadline) dan usulkan perbaikan dengan SOLID.","Masalah: kohesi rendah (submit, email, laporan, tenggat bercampur); coupling tinggi (baca tabel langsung, panggil SDK cloud, aturan tenggat tertanam) → ganti penyedia cloud/email atau aturan tenggat memaksa ubah kelas yang sama. Perbaikan: pisahkan komponen Pengumpulan Tugas (versi, tenggat, bukti, retry) dan Penyimpanan Berkas; SRP untuk memisah alasan berubah; DIP lewat interface FileStorage/Repository; notifikasi di luar transaksi submit. Biaya: lebih banyak antarmuka/kelas, abstraksi hanya untuk variasi yang relevan."],
["Reservasi loker: dua mahasiswa memesan loker sama bersamaan, retry karena respons hilang, dan notifikasi gagal. Bagaimana rancangan menanganinya?","Invariant: satu loker ≤ 1 reservasi aktif; satu mahasiswa ≤ 1 reservasi aktif. <b>Bersamaan</b>: alokasi atomik via transaksi + constraint unik/penguncian; yang kalah menerima konflik. <b>Retry</b>: operationId/requestId unik → idempotensi, kembalikan reservasi yang sama. <b>Notifikasi gagal</b>: reservasi tetap sah setelah commit; catat pengiriman (outbox), coba ulang, mahasiswa dapat mengambil kode akses; kode berlaku setelah reservasi berhasil. Status: Diajukan→Aktif→Selesai/Dibatalkan, setiap transisi menjaga kedua invariant. Perubahan status+alokasi dalam satu transaksi."]];
